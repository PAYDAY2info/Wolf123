<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Подтягивания: выбери цель</title>
  <style>
    :root {
      --bg: #1a1f2a;
      --accent: #ff5e5b;
      --text: #ffffff;
      --card: #2a303d;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: #a0a0b0;
      margin-bottom: 2rem;
    }
    .controls {
      background: var(--card);
      padding: 1.5rem 2rem;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 400px;
    }
    label {
      display: block;
      margin-bottom: 0.6rem;
      font-weight: 600;
    }
    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #1f242e;
      color: white;
      font-size: 1rem;
    }
    button {
      margin-top: 1.4rem;
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    button:active {
      transform: scale(0.98);
    }
    button:hover {
      background: #e04542;
    }
    #result {
      margin-top: 2rem;
      font-size: 1.3rem;
      font-weight: 700;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s, transform 0.4s;
      white-space: nowrap;
    }
    #result.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <h1>Выбери цель</h1>
  <p class="subtitle">Сколько раз подтянешься сегодня?</p>

  <div class="controls">
    <label for="reps">Количество подтягиваний:</label>
    <select id="reps">
      <option value="5">5 раз</option>
      <option value="6">6 раз</option>
      <option value="7">7 раз</option>
      <option value="8">8 раз</option>
      <option value="9">9 раз</option>
      <option value="10">10 раз</option>
      <option value="11">11 раз</option>
      <option value="12">12 раз</option>
      <option value="13">13 раз</option>
      <option value="14">14 раз</option>
      <option value="15">15 раз</option>
      <option value="16">16 раз</option>
      <option value="17">17 раз</option>
      <option value="18">18 раз</option>
      <option value="19">19 раз</option>
      <option value="20">20 раз</option>
    </select>

    <button onclick="showGoal()">Начать тренировку</button>
  </div>

  <div id="result"></div>

  <script>
    function showGoal() {
      const reps = document.getElementById('reps').value;
      const el = document.getElementById('result');
      el.textContent = `Твоя цель: подтянуться ${reps} раз! 💪`;
      el.classList.add('show');
    }
  </script>
</body>
</html>
